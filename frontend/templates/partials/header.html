<header>
    <!-- Top bar: brand centered, search on the right -->
    <div role="banner">
        <a href="/" aria-label="Raquelle home">
            <h1>RAQUELLE</h1>
        </a>
        <button type="button" id="searchToggle" class="icon-btn" aria-expanded="false" aria-controls="searchBar" aria-label="Open search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
       
        <form id="searchBar" class="search" role="search" method="get" action="{{ url_for('search') }}">
            <button type="button" id="searchClose" aria-label="Close search">&times;</button>
            <div class="search-input">
                <input name="q" id="q" placeholder="Find your clothes..." autocomplete="off" required />
                <button type="submit">Search</button>
            </div>
        </form>
    </div>

    <!-- Primary navigation row -->
    <nav aria-label="Primary">
        <ul>
            <li><a href="#">Eyewears</a></li>
            <li><a href="#">Sports</a></li>
            <li><a href="#">Clothes</a></li>
            <li><a href="#">Shoes</a></li>
            <li><a href="#">Dresses</a></li>
        </ul>
    </nav>
</header>
