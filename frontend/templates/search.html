{% block content %}
{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/search.css') }}">

<!-- Result info + sort + top pagination -->
<section>
    <div>
        <p>Result for {{ q }}</p>
        <p>{{ total }} items found</p>
    </div>

    <form>
        <label for="sort">Sort by</label>
        <select id="sort" name="sort">
            <option>Relevance</option>
            <option>Price</option>
            <option>Newest</option>
            <option>Rating</option>
        </select>
        <button type="button" title="Toggle order">
            <i class="fa-solid fa-arrow-up-long" aria-hidden="true"></i>
            <span class="sr-only">Toggle order</span>
        </button>
    </form>

    <nav aria-label="Pagination">
        <ol>
            <li><span aria-current="page">1</span></li>
            <li><a href="#">2</a></li>

            <li><a href="#">4</a></li>
            <li><a href="#">5</a></li>

    </nav>
</section>
